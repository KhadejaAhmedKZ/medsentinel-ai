# Render.com blueprint — one-click deploy of the MEDSENTINEL backend + dashboard.
# The FastAPI app also serves frontend/index.html at "/", so this single web
# service hosts the whole prototype. Leave GEMINI_API_KEY unset to run offline.
services:
  - type: web
    name: medsentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: "*"
